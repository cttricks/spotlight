<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Spotlight.js — Modern, Zero-Dependency Site Tour Engine</title>
    <meta name="description" content="A smooth, modern, and zero-dependency site tour engine with declarative data-spot attributes, rich media, and adaptive themes." />
    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('spotlight-site-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Spotlight CSS from local CDN server -->
    <link rel="stylesheet" href="http://localhost:3000/styles/spotlight.css" id="spotlight-stylesheet" />
  </head>
  <body class="bg-white dark:bg-black text-neutral-900 dark:text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white dark:selection:bg-neutral-200 dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
