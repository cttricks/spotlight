<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />

  <!-- Primary Meta Tags -->
  <title>Spotlight — Modern, Zero-Dependency Site Tour Engine</title>
  <meta name="title" content="Spotlight — Modern, Zero-Dependency Site Tour Engine" />
  <meta name="description"
    content="A smooth, modern, and zero-dependency site tour engine with declarative data-spot attributes, rich media, and adaptive themes." />
  <link rel="canonical" href="https://spotlight.cttricks.com" />

  <!-- Open Graph / Facebook / LinkedIn / Discord -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://spotlight.cttricks.com" />
  <meta property="og:title" content="Spotlight — Modern, Zero-Dependency Site Tour Engine" />
  <meta property="og:description"
    content="A smooth, modern, and zero-dependency site tour engine with declarative data-spot attributes, rich media, and adaptive themes." />
  <meta property="og:image" content="https://spotlight.cttricks.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Spotlight — Modern, Zero-Dependency Site Tour Engine" />
  <meta property="og:site_name" content="Spotlight" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://spotlight.cttricks.com" />
  <meta name="twitter:title" content="Spotlight — Modern, Zero-Dependency Site Tour Engine" />
  <meta name="twitter:description"
    content="A smooth, modern, and zero-dependency site tour engine with declarative data-spot attributes, rich media, and adaptive themes." />
  <meta name="twitter:image" content="https://spotlight.cttricks.com/og-image.jpg" />
  <meta name="twitter:image:alt" content="Spotlight — Modern, Zero-Dependency Site Tour Engine" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <!-- Anti-FOUC Theme Script -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('spotlight-site-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        document.documentElement.style.colorScheme = theme;
      } catch (e) { }
    })();
  </script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- Spotlight CSS from esm.sh CDN -->
  <link rel="stylesheet" href="https://esm.sh/@cttricks/spotlight/dist/styles/spotlight.css"
    id="spotlight-stylesheet" />
</head>

<body
  class="bg-white dark:bg-black text-neutral-900 dark:text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white dark:selection:bg-neutral-200 dark:selection:text-black">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
